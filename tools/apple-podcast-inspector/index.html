<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Podcast Feed Inspector</title>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
  <script defer src="gutil.js"></script>
  <style>
    .audio-icon {
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      font-size: 75px;
      background: antiquewhite;
    }

    .audio-icon svg {
      width: 100%;
      height: 100%;
    }

    .highlight {
      background-color: rgba(255, 255, 0, 0.5);
      transition: background-color 75ms !important;
    }

    .copyable {
      cursor: pointer;
      display: inline-block;
      position: relative;
    }

    .copyable::before {
      content: '📋';
      /* Download icon */
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 50px;
      opacity: 0;
      transition: opacity 100ms !important;
      z-index: 9000;
    }

    .copyable:hover::before {
      opacity: .6;
    }

    .clickable {
      cursor: pointer;
      display: inline-block;
      position: relative;
    }

    .clickable::before {
      content: '⬇️';
      /* Download icon */
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 75px;
      opacity: 0;
      transition: opacity 100ms !important;
      z-index: 9000;
    }

    .clickable:hover::before {
      opacity: .8;
    }

    .clickable img {
      width: 200px;
      height: 200px;
      display: block;
    }

    .downloading {
      position: relative;
      display: inline-block;
      cursor: wait !important;
    }

    .downloading>a {
      cursor: wait !important;
    }

    .downloading::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px;
      height: 60px;
      margin: -30px 0 0 -30px;
      /* Center the spinner */
      border-left: 6px solid rgba(0, 174, 239, .15);
      border-right: 6px solid rgba(0, 174, 239, .15);
      border-bottom: 6px solid rgba(0, 174, 239, .15);
      border-top: 6px solid rgba(0, 174, 239, 1);
      border-radius: 100%;
      animation: dlrotation 1s infinite linear !important;
      z-index: 10001;
    }

    @keyframes dlrotation {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(359deg);
      }
    }

    .downloading::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.75);
      /* Semi-transparent black overlay */
      z-index: 10000;
      /* Ensure it is above the element but below the spinner */
    }
  </style>
</head>

<body x-data="podcastFinder()" class="container">
  <header>
    <h1>Apple Podcast Feed Inspector</h1>
    <p><small><i>Click on assets to download. Click on text blocks to copy to your clipboard.</small></i></p>
    <form @submit.prevent="findFeedUrl">
      <fieldset role="group">
        <input type="text" placeholder="Apple Podcast ID (or URL, which has the ID)" id="url" x-model="url" required>
        <button type="submit">Retrieve</button>
      </fieldset>
    </form>
  </header>
  <main>
    <div x-show="feed">
      <h2 x-text="feed.title" class="copyable" @click="copyText"></h2>
      <p>
        <small x-text="feed.episodes?.length + ' episodes from '"></small>
        <small x-text="feedUrl" class="copyable" @click="copyText"></small>
      </p>
      <section x-html="feed.description" class="copyable" @click="copyText"></section>
      <p>
      <div class="clickable" @click.prevent="downloadFile(feed.coverArt, gutil.slug(feed.title) + '.tbd', $event)">
        <a :href="feed.coverArt" x-show="feed.coverArt">
          <img :src="feed.coverArt" alt="Cover Art">
        </a>
      </div>
      </p>
    </div>
    <br />
    <br />
    <div x-show="feed">
      <template x-for="episode in feed.episodes" :key="episode.guid">
        <article>
          <header>
            <h3>
              <span x-text="episode.title" class="copyable" @click="copyText"></span>
              <small x-show="episode.appleURL">
                <a :href="episode.appleURL" target="_blank" title="visit this episode's Apple Podcast page">🍎</a>
              </small>
            </h3>
          </header>
          <p x-text="episode.pubDate" class="copyable" @click="copyText"></p>
          <section x-html="episode.description" class="copyable" @click="copyText"></section>
          <div class="grid">
            <div x-show="episode.episodeArt">
              <div class="clickable"
                @click.prevent="downloadFile(episode.episodeArt, gutil.slug(feed.title, episode.title) + '.tbd', $event)">
                <a :href="episode.episodeArt">
                  <img :src="episode.episodeArt" alt="Episode Art">
                </a>
              </div>
            </div>
            <div x-show="episode.enclosureUrl">
              <div class="clickable"
                @click.prevent="downloadFile(episode.enclosureUrl, gutil.slug(feed.title, episode.title) + '.tbd', $event)">
                <a :href="episode.enclosureUrl">
                  <div class="audio-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24"
                      height="24">
                      <path
                        d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z">
                      </path>
                      <path
                        d="M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.061 4.5 4.5 0 0 0 0-6.364.75.75 0 0 1 0-1.06Z">
                      </path>
                    </svg>
                  </div>
                </a>
              </div>
            </div>
        </article>
      </template>
    </div>
    <p x-show="error" x-text="'Error: ' + error"></p>
  </main>
  <footer>
  </footer>

  <script>
    function podcastFinder() {
      return {
        url: 'https://podcasts.apple.com/us/podcast/randos-read/id1725933732',
        appleShowId: '',
        feedUrl: '',
        feed: '',
        error: '',
        async findFeedUrl() {
          this.error = ''
          this.appleShowId = ''
          this.feedUrl = ''
          this.feed = ''
          this.appleFeed = []

          const match = this.url.match(/id(\d+)/)
          this.appleShowId = match ? match[1] : null

          if (this.appleShowId) {
            try {
              const response = await fetch(`${gutil.CORS_PROXY}https://itunes.apple.com/lookup?id=${this.appleShowId}&entity=podcast`)
              const result = await response.json()
              const info = result?.results?.[0]
              this.feedUrl = info?.feedUrl || 'Not found'

              if (this.feedUrl !== 'Not found') {
                const feedResponse = await fetch(gutil.CORS_PROXY + this.feedUrl)
                const feedText = await feedResponse.text()
                const feedObj = gutil.xml2js(feedText, new Set(), true)
                const channel = feedObj.rss.channel

                this.feed = {
                  title: channel.title['#cdata'] ?? channel.title,
                  description: channel.description['#cdata'] ?? channel.description,
                  coverArt: channel['itunes:image']?.['@href'],
                  author: channel['itunes:author'],
                  summary: channel['itunes:summary'],
                  episodes: channel.item.map(episode => ({
                    guid: episode.guid?.['#text'],
                    title: episode.title?.['#cdata'] ?? episode.title,
                    description: episode.description?.['#cdata'] ?? episode.description,
                    pubDate: episode.pubDate,
                    enclosureUrl: episode.enclosure?.['@url'],
                    episodeArt: episode['itunes:image']?.['@href'],
                  }))
                }

                gutil.fetchAllApplePodcastEpisodes(this.appleShowId, this.feed?.episodes?.length).then(appleEpisodeInfo => {
                  for (const info of appleEpisodeInfo) {
                    const feedEpisode = this.feed.episodes.find(ep => ep.guid === info.attributes.guid)
                    if (feedEpisode) {
                      feedEpisode.appleURL = info.attributes.url
                    }
                  }
                })
              }
            } catch (err) {
              this.error = err.message
            }
          } else {
            this.error = 'Invalid Apple Podcast URL'
          }
        },
        async downloadFile(url, filename, event) {
          const clickableElement = event.target.closest('.clickable')
          if (!clickableElement) {
            console.error('No clickable element found')
            return
          }
          if (clickableElement.classList.contains('downloading')) return
          clickableElement.classList.toggle('downloading')
          try {
            filename = `${filename.split('.').shift()}.${gutil.assetsuffix(url)}`
            const [response, whatevs] = await Promise.all([
              fetch(gutil.CORS_PROXY + url),
              new Promise(resolve => setTimeout(resolve, 50)) // ensures user will see downloading state
            ])
            const blob = await response.blob()
            const link = document.createElement('a')
            link.href = URL.createObjectURL(blob)
            link.download = filename
            document.body.appendChild(link)
            link.click()
            document.body.removeChild(link)
            URL.revokeObjectURL(link.href)
          } catch (err) {
            console.error('Download error:', err)
          } finally {
            clickableElement.classList.toggle('downloading')
            gutil.ding()
          }
        },
        copyText(event) {
          const target = event.target
          navigator.clipboard.writeText(target.innerText)
          target.classList.toggle('highlight')
          setTimeout(() => {
            target.classList.toggle('highlight')
          }, 150)
        },
      }
    }

    document.addEventListener('alpine:init', () => {
      Alpine.data('podcastFinder', podcastFinder)
    })
  </script>
</body>

</html>
